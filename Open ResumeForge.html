<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Open ResumeForge Pro</title>
  <meta http-equiv="refresh" content="0; url=http://localhost:8000/">
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f7fb; color: #0f172a; display: grid; place-items: center; min-height: 100vh; margin: 0; }
    .box { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 32px; max-width: 520px; box-shadow: 0 8px 24px rgba(15,23,42,.08); }
    h1 { font-size: 22px; margin: 0 0 12px; }
    li { margin-bottom: 8px; }
    a { color: #2b4fd8; font-weight: 600; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Opening ResumeForge Pro…</h1>
    <p>If the app does not open, the server is not running yet:</p>
    <ol>
      <li>Double-click <b>start.bat</b> in the app folder.</li>
      <li>Keep the black window that appears open.</li>
      <li>Then go to <a href="http://localhost:8000/">http://localhost:8000</a>.</li>
    </ol>
  </div>
</body>
</html>
